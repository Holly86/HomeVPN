name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and package pinned runtime
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Create draft release for signing review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG artifacts/installer/HomeVPN-Setup-win-x64.exe artifacts/installer/HomeVPN.msi --draft --generate-notes --title $env:RELEASE_TAG
