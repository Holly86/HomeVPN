name: build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build pinned runtime, test and package
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HomeVPN-Setup-win-x64
          path: |
            artifacts/installer/HomeVPN-Setup-win-x64.exe
            artifacts/installer/HomeVPN.msi
          if-no-files-found: error
